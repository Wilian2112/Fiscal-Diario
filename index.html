<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacopedra - Dashboard de Obras</title>
    
    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        primary: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#15803d', 700: '#166534', 900: '#064e3b' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base */
        body { background-color: #f8fafc; overflow-x: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        /* Calendário */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-header-day { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-align: center; padding-bottom: 10px; text-transform: uppercase; }
        .calendar-day { 
            aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; 
            font-size: 0.85rem; border-radius: 10px; font-weight: 800; position: relative; 
            transition: all 0.2s; cursor: pointer; z-index: 1; background-color: #f1f5f9; color: #475569;
        }
        .calendar-day:hover { transform: scale(1.1); z-index: 50; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        /* Status Cores */
        .status-aprovado { background-color: #15803d !important; color: white !important; }
        .status-revisar { background-color: #ef4444 !important; color: white !important; }
        .status-pendente { background-color: #fbbf24 !important; color: white !important; }
        .status-vazio { background-color: #f1f5f9; color: #475569; }
        .day-sabado { background-color: #e2e8f0 !important; } 
        .day-domingo { background-color: #cbd5e1 !important; } 
        .day-today { border: 2.5px solid #15803d !important; box-shadow: 0 0 10px rgba(21, 128, 61, 0.3); z-index: 10; }
        
        /* Alertas Visuais */
        .stripe-alert {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; 
            background: repeating-linear-gradient(-45deg, #fbbf24, #fbbf24 4px, #000 4px, #000 8px);
            border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; z-index: 20; 
        }

        /* Painéis e Overlays */
        #login-overlay { backdrop-filter: blur(16px); background-color: rgba(6, 78, 59, 0.9); }
        #side-panel { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #side-panel.open { transform: translateX(0); }
        .side-overlay { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .side-overlay.open { opacity: 1; pointer-events: auto; }

        .details-section { border: 1px solid #e2e2f0; border-radius: 1.25rem; margin-bottom: 0.75rem; overflow: hidden; background: #f8fafc; }
        .details-section summary { list-style: none; padding: 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: #64748b; }
        .details-section[open] { background: white; border-color: #15803d; }

        .status-dropdown {
            display: none; position: absolute; top: 110%; right: 0; width: 220px; 
            background: white; border: 1px solid #e2e8f0; border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 100; padding: 8px;
        }
        .status-dropdown.open { display: block; }
        
        .sync-spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .custom-checkbox {
            width: 20px; height: 20px; border-radius: 4px; border: 2px solid #cbd5e1;
            appearance: none; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .custom-checkbox:checked { background-color: #15803d; border-color: #15803d; }
        .custom-checkbox:checked::after {
            content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            color: white; font-size: 10px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- TOAST NOTIFICATION -->
    <div id="toast-sucesso" class="fixed top-10 left-1/2 -translate-x-1/2 z-[300] hidden">
        <div class="bg-emerald-600 text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-4 animate-in fade-in slide-in-from-top-5 duration-300 border border-emerald-500/20">
            <div class="bg-white/20 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fas fa-check text-sm"></i>
            </div>
            <span id="toast-text" class="text-[10px] font-black uppercase tracking-[0.2em]">Sucesso!</span>
        </div>
    </div>

    <!-- LOGIN POP-UP -->
    <div id="login-overlay" class="fixed inset-0 z-[200] flex items-center justify-center overflow-hidden">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md p-10 m-4 text-center relative overflow-hidden">
            <div class="inline-flex items-center justify-center mb-8">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmHLLhhzqVAzvECxD7HCqYHK4Znpr3kQvwYg&s" alt="Logo Pacopedra" class="h-20 w-auto object-contain">
            </div>
            <h2 class="text-3xl font-black text-gray-900 tracking-tight mb-2">Acesso Restrito</h2>
            <p class="text-gray-500 mb-8 font-medium">Insira o Token JWT Pacopedra.</p>
            <div id="login-error" class="hidden mb-6 bg-red-50 border border-red-100 text-red-600 p-4 rounded-2xl text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2 animate-bounce">
                <i class="fas fa-exclamation-triangle"></i> Por favor, insira o token.
            </div>
            <input type="password" id="popup-token" class="w-full px-6 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none mb-6 font-mono text-center tracking-widest focus:border-green-700 transition-all" placeholder="TOKEN JWT">
            <button onclick="realizarLogin()" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-5 rounded-2xl shadow-xl transition-all active:scale-95 uppercase tracking-widest">Acessar Painel</button>
        </div>
    </div>

    <!-- MODAL SELEÇÃO DE OBRAS -->
    <div id="modal-selecao-obras" class="fixed inset-0 z-[160] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-[1.5rem] shadow-2xl w-full max-w-lg flex flex-col overflow-hidden">
            <div class="p-6 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-slate-700 flex items-center gap-3">
                    <i class="fas fa-list-check text-green-700"></i> Seleção
                    <span id="modal-selection-count" class="text-[10px] font-black text-green-700 bg-green-50 px-2.5 py-1 rounded-full uppercase tracking-widest border border-green-100">0 selecionadas</span>
                </h2>
                <button onclick="fecharModalSelecao()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="px-6 pb-2">
                <div class="relative mb-4">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-obras-modal" oninput="renderListaSelecao()" placeholder="Pesquisar obra..." class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-green-500/20 transition-all">
                </div>
            </div>
            <div id="lista-obras-selecao" class="flex-grow overflow-y-auto max-h-[50vh] px-6 py-2 space-y-1 custom-scroll"></div>
            <div class="p-6 bg-gray-50">
                <button onclick="aplicarFiltroSelecao()" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95">CONFIRMAR SELEÇÃO</button>
            </div>
        </div>
    </div>

    <!-- MODAL PENDÊNCIAS -->
    <div id="modal-pendencias" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-black uppercase tracking-tighter">Pendências de Relatórios</h2>
                <button onclick="fecharModalPendencias()" class="text-gray-400 hover:text-gray-600 transition-all"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-8 overflow-y-auto max-h-[60vh] custom-scroll">
                <div id="container-texto-whatsapp" class="bg-gray-900 text-emerald-400 p-6 rounded-2xl font-mono text-xs whitespace-pre-wrap leading-relaxed border border-gray-800 shadow-inner">
                    Gerando lista formatada...
                </div>
            </div>
            <div class="p-6 border-t bg-gray-50 flex gap-3">
                <button onclick="copiarTextoWhatsApp()" class="flex-1 bg-green-700 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
                    <i class="fas fa-copy text-xl"></i> COPIAR TEXTO
                </button>
                <button onclick="downloadTextoPendencias()" class="flex-1 bg-slate-600 hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
                    <i class="fas fa-file-download text-xl"></i> DOWNLOAD (.TXT)
                </button>
            </div>
        </div>
    </div>

    <!-- PAINEL LATERAL (DETALHES) -->
    <div id="side-overlay" onclick="closeDetails()" class="side-overlay fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100]"></div>
    <div id="side-panel" class="fixed top-0 right-0 h-full w-full max-w-xl bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
            <div>
                <h3 id="side-obra-nome" class="text-lg font-black text-gray-900 uppercase tracking-tighter inline-block mr-2">Obra</h3>
                <div id="side-obra-link-container" class="inline-block"></div>
                <p id="side-data" class="text-green-700 font-bold text-xs uppercase"></p>
            </div>
            <div class="flex items-center gap-2">
                <button id="side-refresh-btn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border shadow-sm hover:bg-gray-100 transition-all text-green-700">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button onclick="closeDetails()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border shadow-sm hover:bg-gray-100 transition-all">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div id="side-content" class="flex-grow overflow-y-auto custom-scroll p-8"></div>
    </div>

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-6">
            <div class="flex items-center gap-3 shrink-0">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmHLLhhzqVAzvECxD7HCqYHK4Znpr3kQvwYg&s" alt="Logo Pacopedra" class="h-12 w-auto object-contain">
                <div class="hidden sm:block">
                    <h1 class="text-lg font-black text-gray-900 uppercase tracking-tighter leading-none">Pacopedra</h1>
                    <span id="last-update-tag" class="text-[8px] font-bold text-gray-400 uppercase tracking-widest block mt-1">Sincronizando...</span>
                </div>
            </div>

            <div class="flex-grow relative flex items-center gap-2">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]"></i>
                    <input type="text" id="search-input" oninput="handleGlobalSearch()" placeholder="Pesquisar no painel..." class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 pl-10 pr-4 text-xs font-bold outline-none focus:ring-2 focus:ring-green-500/20 transition-all">
                </div>
                <button onclick="abrirModalSelecao()" class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-[10px] font-black hover:bg-gray-50 uppercase shrink-0">
                    <i class="fas fa-filter"></i> Seleção de Obras
                </button>
            </div>
            
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="abrirModalPendencias()" class="px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-xl text-[10px] font-black uppercase border border-emerald-100">
                    Gerar Pendências <i class="fas fa-list-ul ml-2"></i>
                </button>
                <button onclick="iniciarSincronizacao(true)" class="w-10 h-10 flex items-center justify-center bg-green-50 text-green-700 rounded-xl border border-green-100">
                    <i id="sync-icon-manual" class="fas fa-sync-alt"></i>
                </button>
                <button onclick="sair()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-50 text-gray-400 hover:text-red-500 border border-gray-200">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>

        <!-- Navegação de Meses -->
        <div class="bg-gray-50 border-b border-gray-200 py-3">
            <div class="max-w-7xl mx-auto px-4 flex items-center justify-center gap-6">
                <button onclick="changeGlobalMonth(-1)" class="bg-white px-4 py-2 rounded-xl text-[10px] font-black border uppercase hover:bg-gray-50">Anterior</button>
                <div class="bg-white px-8 py-2 rounded-xl border border-green-100 shadow-sm min-w-[180px] text-center">
                    <span id="global-month-label" class="text-[11px] font-black uppercase text-green-800 tracking-widest">Janeiro 2024</span>
                </div>
                <button id="global-next-btn" onclick="changeGlobalMonth(1)" class="bg-white px-4 py-2 rounded-xl text-[10px] font-black border uppercase hover:bg-gray-50">Próximo</button>
            </div>
        </div>
    </header>

    <!-- DASHBOARD -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="loader" style="display: none;" class="py-20 text-center">
            <div class="inline-block w-10 h-10 border-4 border-green-700 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-400 font-black text-[9px] mt-4 uppercase tracking-widest">Sincronizando dados...</p>
        </div>
        <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        const API_ENDPOINT = "https://apiexterna.diariodeobra.app/v1";
        const WEB_APP_BASE = "https://web.diariodeobra.app/#/app/obras/";
        const LINK_PLANILHA_CSV = "https://docs.google.com/spreadsheets/d/1TO_r3DB92WKXOOkrMnjxj-imROFvQ12WEvE98Tdtm6s/export?format=csv&gid=0";
        
        let cachedData = [];
        let todasObras = [];
        let manualOverrides = JSON.parse(localStorage.getItem('obras_manual_overrides') || '{}');
        let selectedObraIds = new Set();
        let now = new Date();
        let globalViewDate = new Date(now.getFullYear(), now.getMonth(), 1, 12, 0, 0);
        let reportDetailsCache = {}; 
        let globalSearchTerm = "";

        /* --- UTILIDADES --- */

        function lockScroll() { document.body.style.overflow = 'hidden'; }
        function unlockScroll() { document.body.style.overflow = ''; }
        
        function normalizeString(str) {
            return str ? str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ').trim() : "";
        }

        function parseDateSafely(dateStr) {
            if (!dateStr) return null;
            let y, m, d;
            if (dateStr.includes('T')) [y, m, d] = dateStr.split('T')[0].split('-').map(Number);
            else if (dateStr.includes('/')) [d, m, y] = dateStr.split('/').map(Number);
            else [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d, 12, 0, 0);
        }

        function mostrarAviso(mensagem) {
            const toast = document.getElementById('toast-sucesso');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = mensagem;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function getStatusConfig(statusObj) {
            const id = parseInt(statusObj?.id);
            const desc = (statusObj?.descricao || "").toLowerCase();
            if (id === 3 || desc.includes("revisar")) return { label: 'Revisar', css: 'status-revisar', priority: 3 };
            if (id === 1 || desc.includes("preenchendo")) return { label: 'Pendente', css: 'status-pendente', priority: 2 };
            if (id === 2 || desc.includes("aprovado")) return { label: 'Aprovado', css: 'status-aprovado', priority: 1 };
            return { label: '', css: 'status-vazio', priority: 0 };
        }

        /* --- API E DADOS --- */

        async function apiCall(path) {
            const token = sessionStorage.getItem('diario_token');
            try {
                const response = await fetch(`${API_ENDPOINT}${path}`, { headers: { 'token': token, 'Content-Type': 'application/json' } });
                return await response.json();
            } catch (e) { return { error: true }; }
        }

        async function realizarLogin() {
            const input = document.getElementById('popup-token');
            const errorMsg = document.getElementById('login-error');
            const btn = event.target;
            const token = input.value.trim();

            if (!token) {
                errorMsg.innerText = "Por favor, insira o token.";
                errorMsg.classList.remove('hidden');
                input.classList.add('border-red-500', 'bg-red-50');
                input.focus();
                return;
            }

            btn.innerText = "VALIDANDO...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_ENDPOINT}/empresa`, { headers: { 'token': token, 'Content-Type': 'application/json' } });
                const data = await response.json();
                if (response.status !== 200 || !data._id) throw new Error("Invalido");

                sessionStorage.setItem('diario_token', token);
                document.getElementById('login-overlay').style.display = 'none';
                unlockScroll();
                iniciarSincronizacao();
            } catch (e) {
                errorMsg.innerText = "Token inválido ou expirado.";
                errorMsg.classList.remove('hidden');
                input.value = "";
                input.focus();
            } finally {
                btn.innerText = "Acessar Painel";
                btn.disabled = false;
            }
        }

        async function iniciarSincronizacao(isSilent = false) {
            const syncIcon = document.getElementById('sync-icon-manual');
            if (isSilent) syncIcon.classList.add('sync-spinning');
            else document.getElementById('loader').style.display = 'block';

            const anoAtual = new Date().getFullYear();
            const responseObras = await apiCall('/obras');
            
            if (Array.isArray(responseObras)) {
                todasObras = responseObras;
                syncSelectionWithFilters();
            }

            const results = await Promise.all(todasObras.map(async (obra) => {
                const relsList = await apiCall(`/obras/${obra._id}/relatorios?dataInicio=${anoAtual}-01-01&dataFim=${anoAtual}-12-31&limite=1000`);
                return { obra, relsMes: Array.isArray(relsList) ? relsList : [] };
            }));

            cachedData = results;
            updateGlobalLabel();
            if (isSilent) syncIcon.classList.remove('sync-spinning');
            else document.getElementById('loader').style.display = 'none';
            
            document.getElementById('last-update-tag').innerText = `Atualizado às ${new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`;
            render();
        }

        /* --- RENDERIZAÇÃO E UI --- */

        function render() {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';
            
            cachedData.filter(res => {
                const isSelected = selectedObraIds.has(res.obra._id);
                const matchSearch = res.obra.nome.toLowerCase().includes(globalSearchTerm);
                return isSelected && matchSearch;
            }).forEach(res => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = renderCalendarItemMarkup(res);
                container.appendChild(wrapper);
            });
            triggerBackgroundOccurrenceCheck();
        }

        function renderCalendarItemMarkup(res) {
            const ano = globalViewDate.getFullYear();
            const mes = globalViewDate.getMonth();
            const primDiaSemana = new Date(ano, mes, 1).getDay();
            const diasNoMes = new Date(ano, mes + 1, 0).getDate();
            const realToday = new Date();
            const relsMap = {};

            res.relsMes.forEach(r => {
                let dIn = parseDateSafely(r.data);
                let dOut = r.dataFim ? parseDateSafely(r.dataFim) : dIn;
                if (!dIn) return;
                let curr = new Date(dIn);
                while (curr <= dOut) {
                    if (curr.getMonth() === mes && curr.getFullYear() === ano) {
                        const key = `${curr.getFullYear()}-${curr.getMonth()+1}-${curr.getDate()}`;
                        const conf = getStatusConfig(r.status);
                        if (!relsMap[key] || conf.priority >= getStatusConfig(relsMap[key].status).priority) relsMap[key] = r;
                    }
                    curr.setDate(curr.getDate() + 1);
                }
            });

            let html = `<div class="bg-white p-7 rounded-[2rem] border border-gray-100 shadow-sm flex flex-col h-full">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="font-black text-sm text-gray-800 truncate uppercase tracking-tighter w-4/5">${res.obra.nome}</h3>
                    <a href="${WEB_APP_BASE}${res.obra._id}/relatorios" target="_blank" class="text-green-700 bg-green-50 p-1.5 rounded-lg text-[10px]"><i class="fas fa-external-link-alt"></i></a>
                </div>
                <div class="calendar-grid mb-6">
                    ${['D','S','T','Q','Q','S','S'].map(d => `<div class="calendar-header-day">${d}</div>`).join('')}`;
            
            for (let i = 0; i < primDiaSemana; i++) html += `<div></div>`;
            for (let d = 1; d <= diasNoMes; d++) {
                const dateKey = `${ano}-${mes+1}-${d}`;
                const r = relsMap[dateKey];
                const conf = getStatusConfig(r?.status);
                const isToday = (d === realToday.getDate() && mes === realToday.getMonth() && ano === realToday.getFullYear());
                const weekend = new Date(ano, mes, d).getDay();
                let weekendClass = weekend === 0 ? "day-domingo" : (weekend === 6 ? "day-sabado" : "");
                
                html += `<div id="day-${res.obra._id}-${d}-${mes+1}-${ano}" onclick="if('${r?._id || ''}') openDetails('${res.obra._id}', '${res.obra.nome.replace(/'/g, "\\'")}', ${d}, ${mes}, ${ano}, '${r?._id || ''}')" class="calendar-day ${conf.css} ${weekendClass} ${isToday ? 'day-today' : ''}">${d}</div>`;
            }
            return html + `</div></div>`;
        }

        /* --- EVENTOS E MODAIS --- */

        function handleGlobalSearch() {
            globalSearchTerm = document.getElementById('search-input').value.toLowerCase();
            render();
        }

        function changeGlobalMonth(offset) {
            globalViewDate.setMonth(globalViewDate.getMonth() + offset);
            updateGlobalLabel();
            render();
        }

        function updateGlobalLabel() {
            const mesNome = globalViewDate.toLocaleString('pt-br', { month: 'long' });
            document.getElementById('global-month-label').innerText = `${mesNome} ${globalViewDate.getFullYear()}`;
            document.getElementById('global-next-btn').disabled = (globalViewDate.getMonth() === now.getMonth() && globalViewDate.getFullYear() === now.getFullYear());
        }

        function syncSelectionWithFilters() {
            selectedObraIds.clear();
            todasObras.forEach(o => {
                if (manualOverrides[o._id] !== false) selectedObraIds.add(o._id);
            });
        }

        function abrirModalSelecao() { lockScroll(); document.getElementById('modal-selecao-obras').classList.remove('hidden'); renderListaSelecao(); }
        function fecharModalSelecao() { unlockScroll(); document.getElementById('modal-selecao-obras').classList.add('hidden'); }

        function renderListaSelecao() {
            const container = document.getElementById('lista-obras-selecao');
            const search = document.getElementById('search-obras-modal').value.toLowerCase();
            container.innerHTML = '';
            
            todasObras.filter(o => o.nome.toLowerCase().includes(search)).forEach(obra => {
                const isChecked = selectedObraIds.has(obra._id);
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 py-2 border-b last:border-0";
                div.innerHTML = `<input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleObraSelecao('${obra._id}')">
                                 <span class="text-sm font-semibold uppercase ${isChecked ? 'text-slate-800' : 'text-slate-400'}">${obra.nome}</span>`;
                container.appendChild(div);
            });
            document.getElementById('modal-selection-count').innerText = `${selectedObraIds.size} selecionadas`;
        }

        function toggleObraSelecao(id) {
            if (selectedObraIds.has(id)) { selectedObraIds.delete(id); manualOverrides[id] = false; }
            else { selectedObraIds.add(id); manualOverrides[id] = true; }
            localStorage.setItem('obras_manual_overrides', JSON.stringify(manualOverrides));
            document.getElementById('modal-selection-count').innerText = `${selectedObraIds.size} selecionadas`;
        }

        function aplicarFiltroSelecao() { fecharModalSelecao(); render(); }

        /* --- PENDÊNCIAS E WHATSAPP --- */

        async function abrirModalPendencias() {
            lockScroll(); document.getElementById('modal-pendencias').classList.remove('hidden');
            const container = document.getElementById('container-texto-whatsapp');
            container.innerText = "Gerando dados...";

            try {
                const respCsv = await fetch(LINK_PLANILHA_CSV + "&cache_buster=" + Date.now(), { cache: "no-store" });
                const csv = await respCsv.text();
                const mapaEng = {};
                csv.split(/\r?\n/).slice(1).forEach(l => {
                    const c = l.split(csv.includes(';') ? ';' : ',').map(x => x.replace(/"/g, '').trim());
                    if (c[0] && c[1]) mapaEng[normalizeString(c[1])] = c[0];
                });

                const mes = globalViewDate.getMonth();
                const ano = globalViewDate.getFullYear();
                const diaLimite = (ano === now.getFullYear() && mes === now.getMonth()) ? now.getDate() : new Date(ano, mes + 1, 0).getDate();
                const agrupado = {};

                cachedData.filter(res => selectedObraIds.has(res.obra._id)).forEach(res => {
                    let eng = "SEM ENGENHEIRO";
                    const nomeObra = normalizeString(res.obra.nome);
                    for (let k in mapaEng) if (nomeObra.includes(k) || k.includes(nomeObra)) { eng = mapaEng[k]; break; }

                    if (!agrupado[eng]) agrupado[eng] = [];
                    const diasOk = new Set();
                    const diasPend = new Set();
                    res.relsMes.forEach(r => {
                        let dIn = parseDateSafely(r.data);
                        if (dIn && dIn.getMonth() === mes && dIn.getFullYear() === ano) {
                            diasOk.add(dIn.getDate());
                            if (r.status.id === 1) diasPend.add(dIn.getDate());
                        }
                    });

                    const faltam = [];
                    for (let d = 1; d <= diaLimite; d++) {
                        const dt = new Date(ano, mes, d);
                        if (!diasOk.has(d) && dt.getDay() !== 0 && dt.getDay() !== 6) faltam.push(d);
                    }

                    if (diasPend.size > 0 || faltam.length > 0) {
                        agrupado[eng].push({ obra: res.obra.nome, p: Array.from(diasPend), f: faltam });
                    }
                });

                let texto = "";
                Object.keys(agrupado).sort().forEach(eng => {
                    texto += `*\`${eng.toUpperCase()}\`*\n`;
                    agrupado[eng].forEach(i => {
                        if (i.p.length) texto += `Pendente ${i.obra}: ${formatarIntervalos(i.p)}\n`;
                        if (i.f.length) texto += `Não criado ${i.obra}: ${formatarIntervalos(i.f)}\n`;
                    });
                    texto += `\n`;
                });
                container.innerText = texto || "✅ Sem pendências!";
            } catch (e) { container.innerText = "Erro ao carregar dados."; }
        }

        function formatarIntervalos(dias) {
            if (!dias.length) return "";
            dias.sort((a,b) => a-b);
            let res = [], i = 0;
            while(i < dias.length){
                let j = i;
                while(j < dias.length - 1 && dias[j+1] - dias[j] <= 1) j++;
                res.push(j - i >= 2 ? `${dias[i]} ao ${dias[j]}` : dias.slice(i, j+1).join(', '));
                i = j + 1;
            }
            return res.join(' & ');
        }

        function copiarTextoWhatsApp() { 
            navigator.clipboard.writeText(document.getElementById('container-texto-whatsapp').innerText).then(() => mostrarAviso("TEXTO COPIADO!")); 
        }
        
        function downloadTextoPendencias() {
            const blob = new Blob([document.getElementById('container-texto-whatsapp').innerText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `pendencias_${now.getDate()}.txt`; a.click();
            mostrarAviso("DOWNLOAD CONCLUÍDO!");
        }

        function fecharModalPendencias() { unlockScroll(); document.getElementById('modal-pendencias').classList.add('hidden'); }
        function sair() { sessionStorage.removeItem('diario_token'); location.reload(); }
        window.onload = () => { lockScroll(); document.getElementById('login-overlay').style.display = 'flex'; };

    </script>
